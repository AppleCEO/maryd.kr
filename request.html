<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARYD - Custom Jewelry Request</title>
    <link rel="stylesheet" href="css/request.css">
</head>
<body>
    <div class="top-band">
        <img src="images/ThreeLineSecond.png" class="top-menu">
        <a href="index.html"><img src="images/headerLogoSecond.png" class="top-image"></a>
    </div>
    <div class="container">
        <div class="logo-box">
            <a href="index.html"><img src="images/logo.png" alt="MARYD 로고" class="logo-img" /></a>
        </div>

        <div class="request-form">
            <div class="chat-wrapper" id="chat">
                <div class="messages" id="messages"></div>
                <div class="input-row">
                    <input id="chat-input" type="text" placeholder="메시지를 입력하세요" />
                    <button id="chat-send" type="button">전송</button>
                </div>
            </div>
            <h1>AI Custom Jewelry Design</h1>
            <p>
                당신의 취향을 들려주세요.<br> 
                AI가 오직 당신만을 위한 주얼리 디자인을 제안합니다.
            </p>
            <div class="form-grid">
                <div class="form-group">
                    <label for="q1">어떤 종류의 액세서리를 원하시나요? (예: 반지, 목걸이, 귀걸이)</label>
                    <input type="text" id="q1" name="q1" placeholder="예: 반지">
                </div>
                <div class="form-group">
                    <label for="q2">주된 재료는 무엇으로 할까요? (예: 금, 은, 원석)</label>
                    <input type="text" id="q2" name="q2" placeholder="예: 은">
                </div>
                <div class="form-group">
                    <label for="q3">디자인의 핵심 포인트나 장식은 무엇인가요? (예: 탄생석, 특정 문양)</label>
                    <input type="text" id="q3" name="q3" placeholder="예: 푸른 토파즈">
                </div>
                <div class="form-group">
                    <label for="q4">전체적인 스타일은 어떤 느낌이었으면 하나요? (예: 심플, 화려, 빈티지)</label>
                    <input type="text" id="q4" name="q4" placeholder="예: 심플하고 모던하게">
                </div>
                <div class="form-group">
                    <label for="q5">디자인에 영감을 줄 만한 것이 있나요? (예: 좋아하는 영화, 특정 장소)</label>
                    <input type="text" id="q5" name="q5" placeholder="예: 밤하늘의 별">
                </div>
            </div>
            
            <div id="loading">
                
            </div>
            <div id="result-container">
                <h3 id="result-title">AI가 생성한 디자인</h3>
                <img id="result-image" src="" alt="AI가 생성한 주얼리 디자인 이미지">
                <p id="result-text"></p>
                <div id="contact-form">
                    <label>연락처</label>
                    <input type="tel" id="contact"/>
                    <label>추가 요청사항</label>
                    <textarea id="notes" placeholder="사이즈, 예산, 납기 등 추가 요청사항을 적어주세요"></textarea>
                    <button id="send-request" class="submit-btn">요청하기</button>
                 </div>
                 
            </div>
        </div>

        <div class="footer-desc">
            AI 기반 검색엔진과 매리드만의 독자적인 주얼리<br> 
            프롬프트를 통해 세상에 단 하나뿐인<br>
            맞춤 주얼리 제작의 기쁨을 경험해보세요.
        </div>
        
        <div class="back-button-container">
            <a href="index.html" class="back-button-link">
                <img src="images/BackButton.png" class="back">
            </a>
        </div>
    </div>
    <div class="bottom-band">
        <img src="images/MARY'D.png" alt="MARY'D BOTTOM" class="bottom-logo">
        <div class="bottom-section-text">
            AI 기반 검색엔진과 매리드만의 독자적인 주얼리 프롬프트를 통해,<br>
            세상에 단 하나뿐인 맞춤 주얼리 제작의 기쁨을 경험해보세요.
        </div>
        <div class="bottom-buttons-container">
            <a href="https://www.instagram.com/maryd.work/" target="_blank" class="instagram-button">
                <img src="images/instagram.png" alt="Instagram">
            </a>
            <a href="https://www.youtube.com/@byMARYD" target="_blank" class="youtube-button">
                <img src="images/youtube.png" alt="YouTube">
            </a>
        </div>
    </div>

    <script src="js/request.js"></script>
</body>
</html>
